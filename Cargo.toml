[workspace]
members = [
    "crates/raid-defense-core",
    "crates/raid-defense-sim",
    "crates/raid-defense-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
collection-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "d37842b46305c0c44bd1f8a49e09fea71929e77e" }
serde = "=1.0.229"
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.128"
