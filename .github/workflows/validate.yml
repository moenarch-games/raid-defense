name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

jobs:
  fast:
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      # Keep the fast check present; for Markdown-only PRs its scope result
      # makes the Rust and dependent browser jobs inapplicable.
      - name: Classify PR change scope
        id: scope
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE" && -n "$PR_HEAD" ]] &&
            git cat-file -e "$PR_BASE^{commit}" &&
            git cat-file -e "$PR_HEAD^{commit}" &&
            git diff --no-renames --name-only -z "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/changed-files";
          then
            mapfile -d '' -t files < "$RUNNER_TEMP/changed-files"
            if (( ${#files[@]} > 0 )); then
              docs_only=true
              for file in "${files[@]}"; do
                case "$file" in
                  *.md) ;;
                  *) docs_only=false; break ;;
                esac
              done
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        if: steps.scope.outputs.docs_only != 'true'
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format Rust workspace
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust workspace
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo test --all-targets

  integration:
    needs: fast
    if: needs.fast.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Replay opening defense integration trace
        run: cargo test -p raid-defense-core --test opening_defense

  workflow:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install wasm-pack
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-pack
          version: "0.14.0"

      - name: Install browser dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Lint browser boundary
        working-directory: visualization
        run: bun run lint

      - name: Unit and architecture checks for the browser composition layer
        working-directory: visualization
        run: bun run test:unit

      - name: Build Rust/WASM/browser workflow
        working-directory: visualization
        run: bun run build

  e2e:
    needs: workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install wasm-pack
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-pack
          version: "0.14.0"

      - name: Install browser dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: visualization
        run: bunx playwright install --with-deps chromium

      - name: Run browser acceptance
        working-directory: visualization
        run: bun run e2e
